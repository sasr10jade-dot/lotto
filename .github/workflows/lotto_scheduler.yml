name: AI Lotto Agent Auto Sender

on:
  schedule:
    # 매주 금요일 KST 18:00 (UTC 09:00)에 스케줄러 실행
    - cron: '0 9 * * 5'
  workflow_dispatch: # GitHub UI에서 언제든지 수동으로 실행 가능

jobs:
  run-lotto-agent:
    runs-on: ubuntu-latest

    permissions:
      # 필요할 경우 로또 데이터 변경사항을 다시 레포지토리에 커밋할 수 있도록 쓰기 권한 부여
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 캐싱 활성화로 실행 속도 단축

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Lotto Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
        run: python src/main.py

      - name: Commit and Push Updated Lotto Data
        # 메일 발송 성공 후 새 회차가 추가되어 data/lotto_history.json에 변경이 생긴 경우에만 깃허브에 다시 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto_history.json
          git diff-index --quiet HEAD || (git commit -m "chore: update lotto database" && git push)
